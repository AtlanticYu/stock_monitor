<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 行情工作台</title><link rel="icon" href="{{context}}/assets/app-icon.png" type="image/png"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f6f8;color:#203342;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(420px,calc(100% - 32px));padding:40px;background:white;border:1px solid #e0e7ed;border-radius:18px;box-shadow:0 20px 60px #253b4b0a}.brand{display:flex;gap:12px;align-items:center}.brand img{width:42px;height:42px;border-radius:10px}h1{font-size:23px;margin:0}.message{color:#647681;min-height:48px;margin:20px 0}label{display:block;margin:16px 0;color:#425966}input{display:block;width:100%;padding:12px;margin-top:7px;border:1px solid #ccd8e0;border-radius:8px;font:inherit;outline:none}input:focus{border-color:#4e7e9c;box-shadow:0 0 0 3px #ddeaf2}button{width:100%;padding:12px;margin-top:14px;background:#234e68;color:white;border:0;border-radius:8px;font:inherit;cursor:pointer}button:hover{background:#193e56}.foot{font-size:12px;color:#8797a2;text-align:center;margin:24px 0 0}
</style></head><body><main class="card"><div class="brand"><img src="{{context}}/assets/app-icon.png" alt=""><h1>行情工作台</h1></div><p class="message" role="status">{{message}}</p><form method="post" action="{{context}}/login"><input type="hidden" name="_csrf" value="{{csrf}}"><label>用户名<input name="username" autocomplete="username" required autofocus></label><label>密码<input type="password" name="password" autocomplete="current-password" required></label><button type="submit">登录工作台</button></form><p class="foot">行情 · 技术分析 · 量化研究</p></main></body></html>
