<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 行情工作台</title><link rel="icon" href="{{context}}/assets/app-icon.png"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f6f8;color:#203342;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(440px,calc(100% - 32px));padding:36px;background:white;border:1px solid #e0e7ed;border-radius:18px;box-shadow:0 20px 60px #253b4b0a}h1{font-size:23px;margin:0}.message{color:#647681;min-height:48px;margin:16px 0}label{display:block;margin:16px 0;color:#425966}input{display:block;width:100%;padding:12px;margin-top:7px;border:1px solid #ccd8e0;border-radius:8px;font:inherit}button{width:100%;padding:12px;margin-top:14px;background:#234e68;color:white;border:0;border-radius:8px;font:inherit;cursor:pointer}.secondary{background:#e8eff4;color:#234e68}.error{color:#b53333}small{display:block;color:#8797a2;margin-top:20px}
</style></head><body><main class="card"><h1>行情工作台</h1><p class="message" id="status" role="status">登录数据空间账号后，查看和保存属于你的股票、指数及研究记录。</p><form id="cloud-login"><label>邮箱<input id="email" type="email" autocomplete="username" required></label><label>密码<input id="password" type="password" autocomplete="current-password" required minlength="6"></label><button id="submit" type="submit">登录</button><button id="register" class="secondary" type="button">注册数据空间账号</button></form><small>使用数据空间账号登录。公司工作台账号与数据空间账号是否互通，取决于平台认证配置。</small></main>
<script src="{{context}}/assets/supabase-sdk.js"></script><script src="{{context}}/storage-client.js"></script><script>
(() => {
  const status=document.getElementById('status'), submit=document.getElementById('submit'), register=document.getElementById('register');
  async function authenticate(signUp) {
    submit.disabled=register.disabled=true; status.classList.remove('error');
    try {
      const storage=await window.StockStorageReady;
      if(storage.mode!=='supabase')throw new Error('当前未启用数据空间登录');
      const credentials={email:document.getElementById('email').value.trim(),password:document.getElementById('password').value};
      if(!document.getElementById('cloud-login').reportValidity())return;
      const {data,error}=await (signUp?storage.db.auth.signUp(credentials):storage.db.auth.signInWithPassword(credentials));
      if(error)throw error;
      if(data.session)location.href=new URL('./',document.baseURI).toString();
      else status.textContent='注册成功，请完成邮箱验证后登录。';
    }catch(error){status.textContent=error.message||'登录失败，请稍后重试';status.classList.add('error');}
    finally{submit.disabled=register.disabled=false;}
  }
  document.getElementById('cloud-login').addEventListener('submit',event=>{event.preventDefault();authenticate(false);});
  register.addEventListener('click',()=>authenticate(true));
})();
</script></body></html>
